x-app-base: &app-base
  build: .
  expose:
    - "8501"
  volumes:
    # DICOM — top-level mount covers all machines' dicom_roots
    - /mnt/va_transfer_ro:/mnt/va_transfer_ro:ro
    # Output — top-level mount covers all machines' output_roots
    - /mnt/va_transfer_physics_qa:/mnt/va_transfer_physics_qa:rw
    # Config
    - ./machines.yaml:/app/machines.yaml:ro
    # Templates (updated without rebuild)
    - ./templates:/app/templates:ro
    # Assets (overrides baked-in copies for live updates)
    - ./assets:/app/assets:ro
  restart: unless-stopped

services:
  winston_lutz:
    <<: *app-base

  # Future modules: copy the pattern above, override expose port
  # catphan:
  #   <<: *app-base
  #   expose: ["8502"]

  caddy:
    image: caddy:2
    ports:
      - "8080:8080"
    environment:
      - no_proxy=winston_lutz,catphan,localhost,127.0.0.1,172.19.0.0/16,.local
      - NO_PROXY=winston_lutz,catphan,localhost,127.0.0.1,172.19.0.0/16,.local
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - winston_lutz
    restart: unless-stopped
