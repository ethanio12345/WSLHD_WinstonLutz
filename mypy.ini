[mypy]
python_version = 3.10
strict = true
warn_unused_configs = true
show_error_codes = true

# Only core/ is type-checked strictly; app.py and pages/ are Streamlit scripts
# where top-level st.* calls make strict typing noisy.
[mypy-core.*]
strict = true

[mypy-pylinac.*]
ignore_missing_imports = true

[mypy-streamlit.*]
ignore_missing_imports = true

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-plotly.*]
ignore_missing_imports = true

[mypy-yaml.*]
ignore_missing_imports = true
