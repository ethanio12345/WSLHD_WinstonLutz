[project]
name = "wsLHD-winstonlutz"
version = "2026.6.0"
description = "Streamlit web GUI wrapping pylinac Winston-Lutz for hospital physics QA"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pylinac>=3.45",
    "streamlit>=1.33",
    "plotly>=5.17.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "requests>=2.28",
]

# Flat-layout Streamlit application — no package is built.
# Dependencies are managed by `uv sync` directly from this file.
